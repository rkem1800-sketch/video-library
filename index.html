<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Videos">
  <title>RK's Video Library</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #07080f; --elev: #12141f; --elev-2: #191c2b;
  --ink: #f6f0e6; --soft: #e6d8c0; --muted: #a39782;
  --gold: #e8b85a; --gold-2: #f3d48a; --gold-dim: #b8893a;
  --line: rgba(232,184,90,0.16); --glow: rgba(232,184,90,0.28);
  --danger: #e07050;
  --sans: "Outfit", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
  --tab-h: 68px;
  --accent: var(--gold);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { background: var(--bg); }
body {
  font-family: var(--sans); color: var(--ink); font-size: 18px; line-height: 1.4;
  background:
    radial-gradient(900px 480px at 50% -12%, rgba(232,184,90,0.18), transparent 58%),
    radial-gradient(700px 500px at 110% 90%, rgba(70,40,130,0.16), transparent 55%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
  padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg { display: block; }
a { color: inherit; }

.app-header {
  position: sticky; top: 0; z-index: 20;
  padding: calc(10px + env(safe-area-inset-top)) 20px 10px;
  background: linear-gradient(to bottom, rgba(7,8,15,0.96) 60%, rgba(7,8,15,0.72) 85%, transparent);
  backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
}
.header-inner { max-width: 560px; margin: 0 auto; position: relative; padding-right: 48px; }
.kicker { margin: 0; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
h1.display { font-family: var(--serif); font-weight: 600; font-size: clamp(2rem, 8vw, 2.5rem); letter-spacing: -0.03em; margin: 2px 0 0; line-height: 1.1; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 1rem; }
.gear {
  position: absolute; right: 0; top: 4px; width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--elev); display: flex; align-items: center; justify-content: center; color: var(--muted);
}
.gear svg { width: 22px; height: 22px; }

.main { padding: 4px 16px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
.panel { display: none; animation: rise 0.38s ease both; }
.panel.active { display: block; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.search-wrap { position: relative; margin: 4px 0 12px; }
.search-wrap svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: var(--muted); fill: none; pointer-events: none; }
#search {
  width: 100%; border: 1px solid var(--line); background: rgba(18,20,31,0.9); border-radius: 16px;
  padding: 15px 14px 15px 46px; font-size: 1.08rem; outline: none; -webkit-appearance: none;
}
#search:focus { border-color: rgba(232,184,90,0.5); box-shadow: 0 0 0 3px rgba(232,184,90,0.15); }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 0 14px; padding: 2px 0 6px; flex-wrap: wrap; }
.chips::-webkit-scrollbar { display: none; }
.chip, .tag { flex: 0 0 auto; border: 1px solid var(--line); background: var(--elev); color: var(--ink); border-radius: 999px; }
.chip { padding: 9px 15px; font-size: 0.95rem; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--gold)); }
.chip[aria-pressed="true"] { background: var(--c, var(--gold)); color: #15100a; border-color: var(--c, var(--gold)); box-shadow: 0 0 18px var(--cg, var(--glow)); }
.chip[aria-pressed="true"] .dot { background: #15100a; }
.tag { padding: 3px 9px; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; color: var(--c, var(--gold-2)); background: var(--cb, rgba(232,184,90,0.1)); border-color: var(--cl, var(--line)); }

.count { margin: 0 0 10px; color: var(--muted); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card {
  appearance: none; border: 1px solid var(--cl, var(--line)); background: var(--card, var(--elev)); border-radius: 22px;
  padding: 12px 12px 14px; text-align: left; min-height: 250px; display: flex; flex-direction: column;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 10px 28px rgba(0,0,0,0.28);
  position: relative; overflow: hidden; transition: transform 0.18s ease;
}
.card::after { content: ""; position: absolute; inset: auto -20% -30% auto; width: 140px; height: 140px; background: radial-gradient(circle, var(--cg, var(--glow)), transparent 70%); pointer-events: none; }
.card:active { transform: scale(0.98); }
.card-visual { height: 92px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
.card-visual svg { height: 80px; width: 80px; }
.card-meta { position: relative; z-index: 1; margin-top: auto; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.08rem; letter-spacing: -0.015em; margin: 6px 0 6px; line-height: 1.18;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.chan { margin: 0 0 8px; font-size: 0.8rem; color: var(--muted); }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; grid-column: 1 / -1; font-size: 1.05rem; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around;
  background: rgba(8,10,18,0.9); backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
  border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button { flex: 1; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
.tabbar button svg { width: 27px; height: 27px; }
.tabbar button[aria-selected="true"] { color: var(--gold); text-shadow: 0 0 12px var(--glow); }
.tabbar button[aria-selected="true"] svg { filter: drop-shadow(0 0 6px var(--glow)); }

/* Sheet */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.28s ease; }
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 640px; margin: 0 auto;
  max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 40px);
  background: linear-gradient(180deg, #1a1d2c 0%, #0e101a 100%);
  border-radius: 26px 26px 0 0; border: 1px solid var(--line); border-bottom: 0;
  box-shadow: 0 -20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(232,184,90,0.08);
  transform: translateY(110%); transition: transform 0.38s cubic-bezier(0.2,0.8,0.2,1);
  display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); pointer-events: none;
}
.sheet.open { transform: none; pointer-events: auto; }
.sheet-chrome { flex: 0 0 auto; height: 30px; touch-action: none; position: relative; }
.grabber { width: 46px; height: 5px; border-radius: 99px; background: rgba(255,255,255,0.28); margin: 10px auto 0; }
.close {
  position: absolute; right: 14px; top: 12px; z-index: 6; width: 46px; height: 46px; border-radius: 50%;
  border: 1.5px solid var(--gold); background: rgba(12,14,24,0.9); color: var(--ink); font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 18px var(--glow);
}
.sheet-scroll { overflow: auto; padding: 4px 20px 32px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; flex: 1 1 auto; }
.sheet-visual { height: 104px; display: flex; align-items: center; justify-content: center; margin: 0 0 6px; }
.sheet-visual svg { width: 92px; height: 92px; filter: drop-shadow(0 8px 24px var(--cg, var(--glow))); }
.sheet h2.title { font-family: var(--serif); font-size: 1.9rem; font-weight: 600; letter-spacing: -0.025em; margin: 0; line-height: 1.12; padding-right: 30px; }
.meta-line { margin: 10px 0 0; color: var(--soft); font-size: 0.98rem; }
.meta-line .sep { color: var(--muted); margin: 0 6px; }
.tags-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.cta {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 16px; border: 0; border-radius: 16px;
  padding: 16px; background: var(--gold); color: #1a1208; font-weight: 700; font-size: 1.1rem; text-decoration: none; box-shadow: 0 0 28px var(--glow);
}
.cta svg { width: 22px; height: 22px; }
.sec-h { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; margin: 26px 0 10px; letter-spacing: -0.02em; }
.gist {
  margin-top: 18px; border-radius: 18px; padding: 16px 16px 16px; border: 1px solid var(--cl, var(--line));
  background: linear-gradient(160deg, var(--cb, rgba(232,184,90,0.1)), rgba(18,20,31,0.6));
}
.gist .lbl { font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--c, var(--gold)); }
.gist p { margin: 6px 0 0; font-size: 1.15rem; line-height: 1.4; color: var(--ink); }
.points { display: grid; gap: 10px; }
.point { background: var(--elev-2); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--gold)); border-radius: 16px; padding: 13px 14px; }
.point h3 { margin: 0; font-size: 1.08rem; font-weight: 700; color: var(--ink); }
.point p { margin: 4px 0 0; font-size: 1rem; color: var(--soft); }
.short { background: var(--elev); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.short-row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.short-row:last-child { border-bottom: 0; }
.short-row .lead { font-weight: 700; color: var(--c, var(--gold)); font-size: 1rem; }
.short-row .t { font-weight: 600; }
.short-row .d { color: var(--muted); font-size: 0.92rem; }

.todo { list-style: none; margin: 0; padding: 0; background: var(--elev); border: 1px solid var(--line); border-radius: 18px; }
.todo li { border-bottom: 1px solid var(--line); }
.todo li:last-child { border-bottom: 0; }
.todo label { display: flex; gap: 14px; align-items: flex-start; padding: 14px; cursor: pointer; font-size: 1.02rem; }
.todo input { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; flex: 0 0 26px; margin: 0; border-radius: 8px; border: 2px solid var(--gold-dim); background: transparent; position: relative; }
.todo input:checked { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 10px var(--glow); }
.todo input:checked::after { content: ""; position: absolute; left: 7px; top: 2px; width: 7px; height: 13px; border: 2.5px solid #1a1208; border-top: 0; border-left: 0; transform: rotate(45deg); }
.todo label.done span { color: var(--muted); text-decoration: line-through; }
.todo .from { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 3px; text-decoration: none; }

.stamps { display: grid; gap: 8px; }
.stamp { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--elev-2); text-decoration: none; font-size: 1rem; }
.stamp .time { flex: 0 0 auto; min-width: 62px; text-align: center; font-weight: 700; color: #15100a; background: var(--c, var(--gold)); border-radius: 999px; padding: 4px 10px; font-size: 0.92rem; }
.stamp .arrow { margin-left: auto; color: var(--muted); }
.watch { margin-top: 22px; display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 16px; background: rgba(224,112,80,0.1); border: 1px solid rgba(224,112,80,0.35); }
.watch svg { width: 22px; height: 22px; flex: 0 0 22px; color: var(--danger); margin-top: 1px; }
.watch p { margin: 0; font-size: 0.98rem; color: var(--soft); }
.watch b { color: #f2a088; }

.del-wrap { margin-top: 28px; }
.del-btn { width: 100%; border: 1px solid rgba(224,112,80,0.45); background: transparent; color: #f2a088; border-radius: 14px; padding: 13px; font-weight: 600; font-size: 1rem; }
.confirm { display: none; border: 1px solid rgba(224,112,80,0.45); border-radius: 16px; padding: 14px; background: rgba(224,112,80,0.08); }
.confirm p { margin: 0 0 12px; font-weight: 600; }
.confirm .row { display: flex; gap: 10px; }
.confirm button { flex: 1; border-radius: 12px; padding: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--elev); }
.confirm .yes { background: var(--danger); color: #1a0c08; border-color: var(--danger); }
.del-wrap.asking .del-btn { display: none; }
.del-wrap.asking .confirm { display: block; }

/* Big picture */
.bp-note { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--elev); color: var(--soft); font-size: 0.98rem; margin-bottom: 14px; }
.bp-note svg { width: 20px; height: 20px; flex: 0 0 20px; color: var(--gold); }
.hero {
  border-radius: 24px; padding: 20px 18px; border: 1px solid rgba(232,184,90,0.35);
  background: radial-gradient(circle at 85% 0%, rgba(232,184,90,0.25), transparent 60%), linear-gradient(165deg,#2a1c0e 0%,#120e08 100%);
  box-shadow: 0 0 40px rgba(232,184,90,0.1); margin-bottom: 14px;
}
.hero .lbl { font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--gold); }
.hero .big { font-family: var(--serif); font-size: 3.2rem; font-weight: 700; line-height: 1; margin: 10px 0 4px; color: var(--gold-2); }
.hero p { margin: 8px 0 0; font-size: 1.1rem; }
.view { appearance: none; width: 100%; text-align: left; display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; padding: 14px; border-radius: 20px; border: 1px solid var(--cl, var(--line)); background: var(--card, var(--elev)); margin-bottom: 10px; }
.view svg { width: 52px; height: 52px; }
.view .who { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--c); }
.view .t { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; margin: 2px 0; line-height: 1.2; }
.view .d { color: var(--muted); font-size: 0.95rem; }

/* Actions */
.group-h { display: flex; align-items: center; gap: 10px; margin: 22px 0 8px; }
.group-h svg { width: 34px; height: 34px; flex: 0 0 34px; }
.group-h h3 { margin: 0; font-family: var(--serif); font-size: 1.15rem; font-weight: 600; line-height: 1.2; }
.group-h button { border: 0; background: none; padding: 0; text-align: left; display: flex; gap: 10px; align-items: center; }
.progress { height: 8px; border-radius: 99px; background: var(--elev-2); overflow: hidden; margin: 6px 0 4px; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold-2)); width: 0; transition: width 0.3s ease; }

/* Settings */
.set-block { background: var(--elev); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 14px; }
.set-block h3 { margin: 0 0 8px; font-family: var(--serif); font-size: 1.2rem; }
.set-block p { margin: 0 0 10px; color: var(--muted); font-size: 0.95rem; }
.del-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.del-item span { flex: 1; font-size: 0.98rem; }
.small-btn { border: 1px solid var(--gold); background: rgba(232,184,90,0.1); color: var(--gold-2); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 0.9rem; }


/* Add video */
.add-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 16px; padding: 15px; margin: 0 0 14px;
  background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: #1a1208; font-weight: 700; font-size: 1.1rem; box-shadow: 0 0 28px var(--glow); }
.add-btn .plus { font-size: 1.5rem; line-height: 1; margin-top: -2px; }
.paste-box { width: 100%; min-height: 120px; resize: vertical; border: 1.5px solid rgba(232,184,90,0.4); background: rgba(18,20,31,0.9); border-radius: 18px;
  padding: 16px; font-size: 1.15rem; line-height: 1.35; outline: none; margin-top: 16px; }
.paste-box:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,184,90,0.18); }
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-row button { flex: 1; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 1.05rem; }
.btn-ghost { border: 1.5px solid var(--gold); background: rgba(232,184,90,0.08); color: var(--gold-2); }
.btn-gold { border: 0; background: var(--gold); color: #1a1208; box-shadow: 0 0 24px var(--glow); }
.btn-gold[disabled] { opacity: 0.6; }
.msg { margin-top: 14px; padding: 14px; border-radius: 16px; font-size: 1.02rem; display: none; }
.msg.show { display: block; }
.msg.ok { background: rgba(95,211,154,0.12); border: 1px solid rgba(95,211,154,0.45); color: #c9f2dc; }
.msg.err { background: rgba(224,112,80,0.1); border: 1px solid rgba(224,112,80,0.45); color: #f6c4b4; }
.msg .small-btn { margin-top: 10px; }
.recent { margin-top: 10px; }
.recent-item { display: flex; gap: 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); font-size: 0.92rem; }
.recent-item a { flex: 1; color: var(--soft); text-decoration: none; word-break: break-all; }
.recent-item .when { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
.recent-item .st { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--c, #5fd39a); }
.field { margin-top: 10px; }
.field label { display: block; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.field input { width: 100%; border: 1px solid var(--line); background: var(--elev-2); border-radius: 12px; padding: 12px; font-size: 1rem; outline: none; }
.field input:focus { border-color: var(--gold); }
.hint { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(232,184,90,0.12); border: 1px solid rgba(232,184,90,0.4); color: var(--gold-2); font-size: 0.95rem; }
.set-block.flash { border-color: var(--gold); box-shadow: 0 0 24px var(--glow); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <p class="kicker" id="kicker">The library</p>
      <h1 class="display" id="headline">Video notes</h1>
      <p class="sub" id="subhead">What do you want to learn today?</p>
      <button type="button" class="gear" id="gear" aria-label="Settings and restore">

  <script>
  (function () {
    "use strict";
    const CAT = {
      Investing:  { c: "#5fd39a", card: "linear-gradient(165deg,#0f2a1d 0%,#08130e 100%)" },
      Crypto:     { c: "#f2a83b", card: "linear-gradient(165deg,#2c1c08 0%,#140d05 100%)" },
      Motivation: { c: "#ff7a52", card: "linear-gradient(165deg,#2e140c 0%,#150907 100%)" },
      Sales:      { c: "#7fa8ff", card: "linear-gradient(165deg,#111c33 0%,#090e1a 100%)" },
      AI:         { c: "#c58bff", card: "linear-gradient(165deg,#22113a 0%,#100819 100%)" },
      Business:   { c: "#3ad6c8", card: "linear-gradient(165deg,#0c2a28 0%,#061413 100%)" },
      Tech:       { c: "#b8e04a", card: "linear-gradient(165deg,#1c2608 0%,#0d1204 100%)" }
    };
    const CATS = Object.keys(CAT);
    function hexA(hex, a) {
      const n = parseInt(hex.slice(1), 16);
      return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
    }
    function catVars(cat) {
      const s = CAT[cat] || { c: "#e8b85a", card: "" };
      return "--c:" + s.c + ";--cb:" + hexA(s.c, 0.12) + ";--cl:" + hexA(s.c, 0.3) + ";--cg:" + hexA(s.c, 0.3) + ";--card:" + s.card + ";";
    }
    function icon(cat) {
      const c = (CAT[cat] || {}).c || "#e8b85a";
      const soft = hexA(c, 0.18);
      if (cat === "Investing") return "<svg viewBox='0 0 80 80' aria-hidden='true'><rect x='6' y='10' width='68' height='60' rx='14' fill='" + soft + "' stroke='" + c + "' stroke-opacity='.45' stroke-width='2'/>" +
        "<path d='M16 56 H64' stroke='" + c + "' stroke-opacity='.35' stroke-width='2'/><rect x='20' y='44' width='7' height='12' rx='2' fill='" + c + "' opacity='.45'/><rect x='33' y='38' width='7' height='18' rx='2' fill='" + c + "' opacity='.45'/><rect x='46' y='32' width='7' height='24' rx='2' fill='" + c + "' opacity='.45'/>" +
        "<path d='M16 46 L30 34 L41 40 L62 20' fill='none' stroke='" + c + "' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/><path d='M52 20 H62 V30' fill='none' stroke='" + c + "' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>";
      if (cat === "Crypto") return "<svg viewBox='0 0 80 80' aria-hidden='true'><ellipse cx='40' cy='62' rx='24' ry='6' fill='" + soft + "'/><circle cx='40' cy='38' r='26' fill='" + soft + "' stroke='" + c + "' stroke-width='4'/><circle cx='40' cy='38' r='19' fill='none' stroke='" + c + "' stroke-opacity='.45' stroke-width='2' stroke-dasharray='3 4'/>" +
        "<path d='M34 26 V50 M38 23 V27 M38 49 V53 M44 23 V27 M44 49 V53' stroke='" + c + "' stroke-width='3' stroke-linecap='round'/><path d='M34 27 H44 a5.5 5.5 0 0 1 0 11 H34 M34 38 H46 a6 6 0 0 1 0 12 H34' fill='none' stroke='" + c + "' stroke-width='3.4' stroke-linejoin='round'/></svg>";
      if (cat === "Motivation") return "<svg viewBox='0 0 80 80' aria-hidden='true'><ellipse cx='40' cy='68' rx='20' ry='5' fill='" + soft + "'/><path d='M40 8 C44 20 60 28 60 46 C60 59 51 66 40 66 C29 66 20 59 20 46 C20 36 26 30 30 24 C31 32 34 36 38 37 C36 26 38 16 40 8 Z' fill='" + soft + "' stroke='" + c + "' stroke-width='3.5' stroke-linejoin='round'/>" +
        "<path d='M40 36 C43 44 50 47 50 54 C50 60 45 64 40 64 C35 64 30 60 30 54 C30 49 34 46 36 42 C37 47 39 48 41 48 C40 44 39 40 40 36 Z' fill='" + c + "' opacity='.85'/></svg>";
      if (cat === "Sales") return "<svg viewBox='0 0 80 80' aria-hidden='true'><path d='M12 18 a8 8 0 0 1 8 -8 H52 a8 8 0 0 1 8 8 V38 a8 8 0 0 1 -8 8 H30 L18 56 V46 H20 a8 8 0 0 1 -8 -8 Z' fill='" + soft + "' stroke='" + c + "' stroke-width='3.5' stroke-linejoin='round'/>" +
        "<path d='M34 52 H58 a8 8 0 0 0 8 -8 V30' fill='none' stroke='" + c + "' stroke-opacity='.5' stroke-width='3' stroke-linecap='round'/><path d='M58 52 L66 62 V50' fill='none' stroke='" + c + "' stroke-opacity='.5' stroke-width='3' stroke-linejoin='round'/>" +
        "<circle cx='26' cy='28' r='3.2' fill='" + c + "'/><circle cx='36' cy='28' r='3.2' fill='" + c + "'/><circle cx='46' cy='28' r='3.2' fill='" + c + "'/></svg>";
      if (cat === "AI") return "<svg viewBox='0 0 80 80' aria-hidden='true'><path d='M40 8 V18' stroke='" + c + "' stroke-width='3.5' stroke-linecap='round'/><circle cx='40' cy='8' r='3.5' fill='" + c + "'/>" +
        "<rect x='14' y='18' width='52' height='40' rx='12' fill='" + soft + "' stroke='" + c + "' stroke-width='3.5'/>" +
        "<circle cx='30' cy='36' r='5' fill='" + c + "'/><circle cx='50' cy='36' r='5' fill='" + c + "'/><path d='M31 47 H49' stroke='" + c + "' stroke-width='3.5' stroke-linecap='round'/>" +
        "<path d='M8 32 V44 M72 32 V44' stroke='" + c + "' stroke-width='4' stroke-linecap='round'/><path d='M28 58 V68 H52 V58' fill='none' stroke='" + c + "' stroke-opacity='.5' stroke-width='3'/></svg>";
      if (cat === "Business") return "<svg viewBox='0 0 80 80' aria-hidden='true'><rect x='10' y='28' width='60' height='40' rx='8' fill='" + soft + "' stroke='" + c + "' stroke-width='3.5'/>" +
        "<path d='M28 28 V22 a6 6 0 0 1 6 -6 H46 a6 6 0 0 1 6 6 V28' fill='none' stroke='" + c + "' stroke-width='3.5' stroke-linejoin='round'/>" +
        "<path d='M10 42 H70' stroke='" + c + "' stroke-width='3' stroke-opacity='.6'/>" +
        "<rect x='34' y='38' width='12' height='8' rx='2' fill='" + c + "'/></svg>";
      if (cat === "Tech") return "<svg viewBox='0 0 80 80' aria-hidden='true'><rect x='14' y='14' width='52' height='16' rx='4' fill='" + soft + "' stroke='" + c + "' stroke-width='3.5'/>" +
        "<rect x='14' y='32' width='52' height='16' rx='4' fill='" + soft + "' stroke='" + c + "' stroke-width='3.5'/>" +
        "<rect x='14' y='50' width='52' height='16' rx='4' fill='" + soft + "' stroke='" + c + "' stroke-width='3.5'/>" +
        "<circle cx='24' cy='22' r='3' fill='" + c + "'/><circle cx='24' cy='40' r='3' fill='" + c + "'/><circle cx='24' cy='58' r='3' fill='" + c + "'/></svg>";
      return "";
    }
    const PLAY = "<svg viewBox='0 0 24 24' fill='currentColor' aria-hidden='true'><path d='M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z'/></svg>";
    const WARN = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M12 3l10 18H2z'/><path d='M12 10v5M12 18v.5'/></svg>";
    const INFO = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><circle cx='12' cy='12' r='9'/><path d='M12 11v6M12 7.5v.5'/></svg>";

    const LS_DEL = "videoLib.deleted.v1", LS_TICK = "videoLib.ticks.v1";
    function load(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    let deleted = load(LS_DEL, []);
    let ticks = load(LS_TICK, {});

    let videos = [], big = null, catFilter = "All", current = null, sheetOpen = false, sheetMode = null, lastFocus = null, sheetHist = false, ignoringPop = false, hideTimer = null, lockedY = 0;

    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
    function mmss(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(r).padStart(2, "0"); }
    function tickKey(v, t) { return v.id + "::" + t; }
    function live() { return videos.filter(function (v) { return deleted.indexOf(v.id) === -1; }); }
    function sorted(list) { return list.slice().sort(function (a, b) { return (b.date || "0").localeCompare(a.date || "0"); }); }
    function hay(v) {
      return [v.title, v.channel, v.category, v.gist, v.watch, v.dateLabel].concat(
        v.points.map(function (p) { return p.title + " " + p.text; }), v.todo,
        v.stamps.map(function (s) { return s.label; }),
        v.list ? v.list.rows.map(function (r) { return r.lead + " " + r.title + " " + r.detail; }) : []
      ).join(" ").toLowerCase();
    }

    function renderChips() {
      const el = document.getElementById("cat-chips");
      const L = live();
      el.innerHTML = "";
      ["All"].concat(CATS).forEach(function (c) {
        const n = c === "All" ? L.length : L.filter(function (v) { return v.category === c; }).length;
        if (c !== "All" && !n) return;
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip";
        b.setAttribute("aria-pressed", catFilter === c ? "true" : "false");
        if (c !== "All") b.setAttribute("style", catVars(c));
        b.innerHTML = (c !== "All" ? "<span class='dot'></span>" : "") + esc(c);
        b.addEventListener("click", function () { catFilter = c; renderChips(); renderLibrary(); });
        el.appendChild(b);
      });
    }

    function metaLine(v) {
      return [v.dateLabel, v.length].filter(Boolean).map(esc).join("<span class='sep'>·</span>");
    }

    function renderLibrary() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const L = live();
      const rows = sorted(L.filter(function (v) {
        return (catFilter === "All" || v.category === catFilter) && (!q || hay(v).indexOf(q) !== -1);
      }));
      document.getElementById("count").textContent = rows.length + " of " + L.length + " video" + (L.length === 1 ? "" : "s");
      const body = document.getElementById("library-body");
      if (!rows.length) { body.innerHTML = "<p class='empty'>No videos match that. Try another word or tap All.</p>"; return; }
      body.innerHTML = "";
      rows.forEach(function (v) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "card"; b.setAttribute("style", catVars(v.category));
        b.innerHTML = "<div class='card-visual'>" + icon(v.category) + "</div><div class='card-meta'>" +
          "<h2>" + esc(v.title) + "</h2><p class='chan'>" + esc(v.channel) + "<br>" + metaLine(v).replace(/<span class='sep'>·<\/span>/g, " · ") + "</p>" +
          "<div class='card-tags'><span class='tag'>" + esc(v.category) + "</span>" + (v.youtubeId || /facebook\.com/i.test(v.url || "") ? "" : "<span class='tag'>Collection</span>") + "</div></div>";
        b.addEventListener("click", function () { openVideo(v); });
        body.appendChild(b);
      });
    }

    function todoHtml(v, showFrom) {
      return "<ul class='todo'>" + v.todo.map(function (t) {
        const k = tickKey(v, t), on = !!ticks[k];
        return "<li><label class='" + (on ? "done" : "") + "'><input type='checkbox' data-k='" + esc(k) + "'" + (on ? " checked" : "") + "><span>" + esc(t) +
          (showFrom ? "" : "") + "</span></label></li>";
      }).join("") + "</ul>";
    }

    function bindTicks(root) {
      root.querySelectorAll("input[type=checkbox][data-k]").forEach(function (inp) {
        inp.addEventListener("change", function () {
          const k = inp.getAttribute("data-k");
          if (inp.checked) ticks[k] = true; else delete ticks[k];
          persist();
          inp.parentElement.classList.toggle("done", inp.checked);
          if (root.id === "actions-body") updateProgress();
        });
      });
    }

    function videoSheet(v) {
      const watchBtn = v.youtubeId
        ? "<a class='cta' href='" + esc(v.url) + "' target='_blank' rel='noopener'>" + PLAY + "Watch on YouTube</a>"
        : /facebook\.com/i.test(v.url || "")
        ? "<a class='cta' href='" + esc(v.url) + "' target='_blank' rel='noopener'>" + PLAY + "Watch on Facebook</a>"
        : "<a class='cta' href='" + esc(v.url) + "' target='_blank' rel='noopener'>" + PLAY + "Open the channel</a>";
      let h = "<div class='sheet-visual'>" + icon(v.category) + "</div>" +
        "<h2 class='title'>" + esc(v.title) + "</h2>" +
        "<p class='meta-line'>" + esc(v.channel) + "</p>" +
        (metaLine(v) ? "<p class='meta-line' style='margin-top:2px;color:var(--muted)'>" + metaLine(v) + "</p>" : "") +
        "<div class='tags-row'><span class='tag'>" + esc(v.category) + "</span></div>" + watchBtn +
        "<div class='gist'><div class='lbl'>The gist</div><p>" + esc(v.gist) + "</p></div>" +
        "<h3 class='sec-h'>Key points</h3><div class='points'>" + v.points.map(function (p) {
          return "<div class='point'><h3>" + esc(p.title) + "</h3><p>" + esc(p.text) + "</p></div>";
        }).join("") + "</div>";
      if (v.list) {
        h += "<h3 class='sec-h'>" + esc(v.list.heading) + "</h3><div class='short'>" + v.list.rows.map(function (r) {
          return "<div class='short-row'><div class='lead'>" + esc(r.lead) + "</div><div><div class='t'>" + esc(r.title) + "</div><div class='d'>" + esc(r.detail) + "</div></div></div>";
        }).join("") + "</div>";
      }
      h += "<h3 class='sec-h'>What to do</h3>" + todoHtml(v);
      if (v.stamps.length) {
        h += "<h3 class='sec-h'>Jump to</h3><div class='stamps'>" + v.stamps.map(function (s) {
          return "<a class='stamp' target='_blank' rel='noopener' href='https://youtu.be/" + esc(v.youtubeId) + "?t=" + s.seconds + "'><span class='time'>" + mmss(s.seconds) + "</span><span>" + esc(s.label) + "</span><span class='arrow'>›</span></a>";
        }).join("") + "</div>";
      }
      if (v.links && v.links.length) {
        h += "<h3 class='sec-h'>Links</h3><div class='stamps'>" + v.links.map(function (l) {
          return "<a class='stamp' target='_blank' rel='noopener' href='" + esc(l.href) + "'><span>" + esc(l.title) + "</span><span class='arrow'>›</span></a>";
        }).join("") + "</div>";
      }
      if (v.watch) h += "<div class='watch'>" + WARN + "<p><b>Watch out:</b> " + esc(v.watch) + "</p></div>";
      h += "<div class='del-wrap' id='del-wrap'><button type='button' class='del-btn' id='del-btn'>Delete this video</button>" +
        "<div class='confirm'><p>Delete this video from your library?</p><div class='row'><button type='button' id='del-no'>Keep it</button><button type='button' class='yes' id='del-yes'>Delete</button></div></div></div>";
      return h;
    }

    function openVideo(v) {
      current = v; sheetMode = "video";
      const body = document.getElementById("sheet-body");
      document.getElementById("sheet").setAttribute("style", catVars(v.category));
      body.innerHTML = videoSheet(v);
      bindTicks(body);
      const wrap = document.getElementById("del-wrap");
      document.getElementById("del-btn").addEventListener("click", function () { wrap.classList.add("asking"); });
      document.getElementById("del-no").addEventListener("click", function () { wrap.classList.remove("asking"); });
      document.getElementById("del-yes").addEventListener("click", function () {
        if (deleted.indexOf(v.id) === -1) deleted.push(v.id);
        persist();
        closeSheet(); refreshAll();
      });
      showSheet();
    }

    let pendingUrl = "";
    function openSettings(needHook, url) {
      sheetMode = "settings"; current = null;
      pendingUrl = url || "";
      document.getElementById("sheet").removeAttribute("style");
      renderSettings(!!needHook);
      showSheet();
      if (!pin) checkSetup().then(function () { if (sheetOpen && sheetMode === "settings") { renderSettings(!!needHook); const f = document.getElementById("pin-in") || document.getElementById("set-pin"); if (needHook && f) f.focus({ preventScroll: true }); } });
      if (needHook) {
        const blk = document.getElementById("connect-block");
        if (blk) { blk.scrollIntoView({ block: "start" }); const f = document.getElementById("pin-in") || document.getElementById("set-pin"); if (f) f.focus({ preventScroll: true }); }
      }
    }
    /* ---------- Account + sync (Video Library API worker) ---------- */
    const API = "https://video-library-api.rkem1800.workers.dev";
    const LS_PIN = "videoLib.pin.v1", LS_DIRTY = "videoLib.dirty.v1", LS_SYNCED = "videoLib.syncedAt.v1";
    try { localStorage.removeItem("videoLib.hook.v1"); } catch (e) {}
    let pin = load(LS_PIN, "") || "";
    let serverSetup = null; // null = unknown, true/false from /status
    let pushTimer = null, syncNote = "";
    function api(path, opts) {
      opts = opts || {};
      const headers = { "Content-Type": "application/json" };
      if (opts.pin !== undefined ? opts.pin : pin) headers["X-PIN"] = opts.pin !== undefined ? opts.pin : pin;
      return fetch(API + path, { method: opts.method || "GET", headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: "no-store" })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.httpStatus = r.status; return j; }); });
    }
    function signOut(reason) {
      pin = ""; try { localStorage.removeItem(LS_PIN); } catch (e) {}
      syncNote = reason || "";
    }
    function persist() {
      save(LS_DEL, deleted); save(LS_TICK, ticks);
      if (!pin) return;
      save(LS_DIRTY, true);
      if (pushTimer) clearTimeout(pushTimer);
      pushTimer = setTimeout(pushState, 600);
    }
    function pushState() {
      pushTimer = null;
      if (!pin) return Promise.resolve();
      return api("/state", { method: "PUT", body: { deleted: deleted, ticks: ticks } }).then(function (j) {
        if (j.ok) { save(LS_DIRTY, false); save(LS_SYNCED, Date.now()); syncNote = ""; }
        else if (j.httpStatus === 401) signOut("Your PIN stopped working. Sign in again.");
        else syncNote = j.message || ("Sync failed (HTTP " + j.httpStatus + ").");
      }).catch(function () { syncNote = "Offline. Changes are saved here and will sync later."; });
    }
    function adoptState(st) {
      deleted = Array.isArray(st.deleted) ? st.deleted.slice() : [];
      ticks = st.ticks && typeof st.ticks === "object" ? Object.assign({}, st.ticks) : {};
      save(LS_DEL, deleted); save(LS_TICK, ticks); save(LS_SYNCED, Date.now()); save(LS_DIRTY, false);
    }
    function pullState() {
      if (!pin) return Promise.resolve();
      if (load(LS_DIRTY, false)) return pushState().then(function () { refreshAll(); });
      return api("/state").then(function (j) {

    function setupGestures() {

      let startY = 0, startX = 0, dragging = false, armed = false, dy = 0, viaScroll = false;
      function begin(y, x, vs) { if (!sheetOpen) return; startY = y; startX = x; dy = 0; dragging = true; viaScroll = vs; armed = !vs; if (armed) sheet.style.transition = "none"; }

        if (!dragging) return;
        const my = y - startY, mx = x - startX;
        if (viaScroll && !armed) {
          if (scroll.scrollTop > 0 || my < 0) return;

        }

        document.getElementById("panel-" + id).classList.toggle("active", id === which);
      });
      const h = HEAD[which];
      document.getElementById("kicker").textContent = h.kicker;
      document.getElementById("headline").textContent = h.title;
      document.getElementById("subhead").textContent = h.sub;
      window.scrollTo(0, 0);
    }

    document.getElementById("tab-library").addEventListener("click", function () { showTab("library"); });
    document.getElementById("tab-big").addEventListener("click", function () { showTab("big"); });
    document.getElementById("tab-actions").addEventListener("click", function () { showTab("actions"); });
    document.getElementById("search").addEventListener("input", renderLibrary);
    document.getElementById("search").addEventListener("keydown", function (e) { if (e.key === "Enter") e.target.blur(); });
    document.getElementById("sheet-close").addEventListener("click", function () { closeSheet(); });
    document.getElementById("backdrop").addEventListener("click", function () { closeSheet(); });
    document.getElementById("gear").addEventListener("click", function () { openSettings(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && sheetOpen) closeSheet(); });
    setupGestures();

    fetch("videos.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        videos = data.videos || []; big = data.bigPicture || null;
        refreshAll();
        pullState();
        const m = location.hash.match(/^#v=(.+)$/);
        if (m) { const v = videos.find(function (x) { return x.id === decodeURIComponent(m[1]); }); if (v) openVideo(v); }
      })
      .catch(function () {
        document.getElementById("library-body").innerHTML = "<p class='empty'>Couldn't load the videos. Check your connection and reopen.</p>";
      });

    window.addEventListener("online", function () { if (pin && load(LS_DIRTY, false)) pushState(); });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && pin && videos.length) pullState(); });
    if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js").catch(function () {}); }
  })();
  </script>
</body>
</html>
